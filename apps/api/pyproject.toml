[project]
name = "note-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "note-core",
    "note-db",
    "note-queue",
    "note-auth-service",
    "note-users-service",
    "note-memory-service",
    "note-sync-service",
    "note-ai-service",
    "note-helpers-service",
    "note-categorization-service",
    "note-search-service",
    "note-notifications-service",
    "note-social-service",
    "note-ingestion-service",
    "note-admin-svc",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.18",
    "websockets>=14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/note_api"]

[tool.uv.sources]
note-core = { workspace = true }
note-db = { workspace = true }
note-queue = { workspace = true }
note-auth-service = { workspace = true }
note-users-service = { workspace = true }
note-memory-service = { workspace = true }
note-sync-service = { workspace = true }
note-ai-service = { workspace = true }
note-helpers-service = { workspace = true }
note-categorization-service = { workspace = true }
note-search-service = { workspace = true }
note-notifications-service = { workspace = true }
note-social-service = { workspace = true }
note-ingestion-service = { workspace = true }
note-admin-svc = { workspace = true }

[project.scripts]
note-api = "note_api.main:run"
