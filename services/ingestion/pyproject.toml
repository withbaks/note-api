[project]
name = "note-ingestion-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "note-core",
    "note-db",
    "note-queue",
    "httpx>=0.28",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic>=2.10",
    "trafilatura>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/note_ingestion"]

[tool.uv.sources]
note-core = { workspace = true }
note-db = { workspace = true }
note-queue = { workspace = true }
