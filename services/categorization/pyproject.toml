[project]
name = "note-categorization-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "note-core",
    "note-db",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/note_categorization"]

[tool.uv.sources]
note-core = { workspace = true }
note-db = { workspace = true }
