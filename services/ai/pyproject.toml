[project]
name = "note-ai-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "note-core",
    "note-db",
    "note-search-service",
    "note-sync-service",
    "note-helpers-service",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic>=2.10",
    "openai>=1.60",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/note_ai"]

[tool.uv.sources]
note-core = { workspace = true }
note-db = { workspace = true }
note-search-service = { workspace = true }
note-sync-service = { workspace = true }
note-helpers-service = { workspace = true }
