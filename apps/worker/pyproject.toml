[project]
name = "note-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "note-core",
    "note-db",
    "note-queue",
    "note-ai-service",
    "note-search-service",
    "arq>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/note_worker"]

[tool.uv.sources]
note-core = { workspace = true }
note-db = { workspace = true }
note-queue = { workspace = true }
note-ai-service = { workspace = true }
note-search-service = { workspace = true }

[project.scripts]
note-worker = "note_worker.main:main"
