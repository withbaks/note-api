[project]
name = "note-auth-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "note-core",
    "note-db",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic[email]>=2.10",
    "PyJWT[crypto]>=2.9",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/note_auth"]

[tool.uv.sources]
note-core = { workspace = true }
note-db = { workspace = true }
