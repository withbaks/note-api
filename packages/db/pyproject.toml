[project]
name = "note-db"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "note-core",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "alembic>=1.14",
    "pgvector>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/note_db"]

[tool.uv.sources]
note-core = { workspace = true }
